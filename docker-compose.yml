# Start everything:     cp .env.example .env && docker compose up --build
# Scale the workers:    docker compose up -d --scale worker=3
# All configuration comes from .env (see .env.example); nothing is hardcoded here.
# Each service gets only the variables it needs (compose reads .env for ${...}). In particular
# LLM_API_KEY is passed to llm-gateway only. A shell variable overrides .env, e.g.
#   LLM_PROVIDER=stub docker compose up -d --build

x-python-healthcheck: &py-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

# Shared by api and worker.
x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:?set in .env}
  REDIS_URL: ${REDIS_URL:?set in .env}
  QUEUE_NAME: ${QUEUE_NAME:-disputes}
  RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-90}

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The only container that holds the provider key.
  llm-gateway:
    build:
      context: .
      dockerfile: llm_gateway/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: ${REDIS_URL:?set in .env}
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      STUB_DELAY_MS: ${STUB_DELAY_MS:-1500}
      LLM_PRICE_PER_1K_PROMPT_TOKENS: ${LLM_PRICE_PER_1K_PROMPT_TOKENS:-0}
      LLM_PRICE_PER_1K_COMPLETION_TOKENS: ${LLM_PRICE_PER_1K_COMPLETION_TOKENS:-0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_REQUEST_DEADLINE_SECONDS: ${LLM_REQUEST_DEADLINE_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_BACKOFF_BASE_SECONDS: ${LLM_BACKOFF_BASE_SECONDS:-1}
      LLM_BACKOFF_MAX_SECONDS: ${LLM_BACKOFF_MAX_SECONDS:-10}
      LLM_CB_FAILURE_THRESHOLD: ${LLM_CB_FAILURE_THRESHOLD:-5}
      LLM_CB_RESET_SECONDS: ${LLM_CB_RESET_SECONDS:-30}
      LLM_MAX_REQUESTS_PER_MINUTE: ${LLM_MAX_REQUESTS_PER_MINUTE:-4}
      LLM_RATE_LIMIT_MAX_WAIT_SECONDS: ${LLM_RATE_LIMIT_MAX_WAIT_SECONDS:-20}
      LLM_FAULT_INJECTION: ${LLM_FAULT_INJECTION:-off}
      # ---------- Observability (docs/observability.md) ----------
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      # ---------- Load testing (docs/load_test.md) ----------
      # The rate limiter's budget when LLM_PROVIDER=stub (the free-tier limit above is for
      # the real provider), so a load test measures this system, not the provider's quota.
      STUB_MAX_REQUESTS_PER_MINUTE: ${STUB_MAX_REQUESTS_PER_MINUTE:-6000}
    # Loopback only: lets host tools (make eval with --judge-client gateway, the breaker demo)
    # reach the gateway without exposing it on the network.
    ports:
      - "127.0.0.1:${LLM_GATEWAY_HOST_PORT:-8100}:8100"
    depends_on:
      redis:
        condition: service_healthy
      # The API creates the tables (including llm_calls) at startup.
      api:
        condition: service_healthy
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz', timeout=3)"]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      <<: *app-env
      # Per-client rate limit on POST endpoints and the duplicate-dispute cache (D7).
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_TRUST_CLIENT_ID: ${RATE_LIMIT_TRUST_CLIENT_ID:-false}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      # Runs from one agent mode are never reused for another.
      CACHE_NAMESPACE: ${AGENT_MODE:-fake}
      # ---------- Observability (docs/observability.md) ----------
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
    restart: unless-stopped

  # Scalable: no container_name and no host ports, so `--scale worker=N` works.
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        # The corpus index is built into the image with this model (D-018).
        EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
    environment:
      <<: *app-env
      # For agent.llm_client.HttpLLMClient; no provider key here.
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:?set in .env}
      LLM_REQUEST_DEADLINE_SECONDS: ${LLM_REQUEST_DEADLINE_SECONDS:-60}
      AGENT_MODE: ${AGENT_MODE:-fake}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-12}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-20}
      AGENT_MAX_WALL_CLOCK_SECONDS: ${AGENT_MAX_WALL_CLOCK_SECONDS:-75}
      AGENT_MAX_VERIFY_RETRIES: ${AGENT_MAX_VERIFY_RETRIES:-1}
      # ---------- Observability (docs/observability.md) ----------
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      # Metrics of the forked work horses, served by the worker on port 9100.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      # ---------- Evaluation variants (docs/evaluation.md, L2 and L3) ----------
      AGENT_VERIFIER_PROMPT_VERSION: ${AGENT_VERIFIER_PROMPT_VERSION:-v1}
      RETRIEVAL_DOWNRANK_TABLES: ${RETRIEVAL_DOWNRANK_TABLES:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      # The API creates the tables at startup; workers wait for it.
      api:
        condition: service_healthy
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python", "-m", "worker.healthcheck"]
    # Observability: the multiprocess metrics files, emptied on every container start.
    tmpfs:
      - /tmp/prometheus
    stop_grace_period: 30s
    restart: unless-stopped

  # Quality over time (L6): scores a sample of finished runs with the eval's LLM judge.
  # Same image as the worker (it needs eval/ and the judge's dependencies), different command.
  quality:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
    command: ["python", "-m", "quality", "run"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:?set in .env}
      LLM_REQUEST_DEADLINE_SECONDS: ${LLM_REQUEST_DEADLINE_SECONDS:-60}
      QUALITY_SAMPLE_RATE: ${QUALITY_SAMPLE_RATE:-0.2}
      QUALITY_INTERVAL_SECONDS: ${QUALITY_INTERVAL_SECONDS:-900}
      QUALITY_MAX_PER_PASS: ${QUALITY_MAX_PER_PASS:-1}
      QUALITY_LOOKBACK_HOURS: ${QUALITY_LOOKBACK_HOURS:-24}
    depends_on:
      api:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Observability (docs/observability.md) ----------
  # Traces: every service exports OTLP/HTTP to Jaeger (in-memory store, UI on :16686).
  # Metrics: Prometheus scrapes api, llm-gateway, every worker replica and cAdvisor (:9090).
  # Grafana (:3300) loads the dashboard in observability/grafana/ at startup. Host ports are
  # bound to 127.0.0.1 only.
  jaeger:
    # 2.20 is the last release that serves the query API Grafana's Jaeger data source uses
    # (/api/services, /api/traces); 2.21 serves only /api/v3.
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      # Local use only: anyone reaching 127.0.0.1:3300 can view dashboards and use Explore.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/dispute-triage.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3300}:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

  # CPU, memory and network per container (D5). Reads the Docker host's cgroups; on Docker
  # Desktop for Mac that is the Linux VM, which is where the containers run.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    privileged: true
    # cgroup v2 gives each container a private cgroup namespace; cAdvisor needs the host's
    # to see the other containers.
    cgroup: host
    volumes:
      - /:/rootfs:ro
      # The socket itself: on Docker Desktop a bind of all of /var/run does not include it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # cAdvisor's Docker support reads images through containerd (Docker Desktop's image store).
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

volumes:
  pgdata:
  prometheus-data:
