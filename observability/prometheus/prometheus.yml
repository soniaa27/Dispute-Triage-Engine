# Scrape targets inside the docker compose network (docs/observability.md).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: llm-gateway
    static_configs:
      - targets: ["llm-gateway:8100"]

  # Every replica of `docker compose up --scale worker=N`: Docker's DNS returns one address
  # per container for the service name.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
